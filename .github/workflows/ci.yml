name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验工具摘要并扫描完整可达历史
        shell: bash
        run: |
          set -euo pipefail
          task_scan_dir=$(mktemp -d)
          trap 'rm -rf "$task_scan_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$task_scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $task_scan_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$task_scan_dir/gitleaks.tar.gz" -C "$task_scan_dir" gitleaks
          "$task_scan_dir/gitleaks" git --redact=100 --no-banner --log-opts=--all .
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$task_scan_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $task_scan_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$task_scan_dir/actionlint.tar.gz" -C "$task_scan_dir" actionlint
          "$task_scan_dir/actionlint" -shellcheck= -pyflakes=
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.9.18'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: python scripts/check.py
      - run: python scripts/check.py --commit-range HEAD
      - run: uvx ruff==0.17.2 check .
      - run: uvx ruff==0.17.2 format --check .
      - run: python -m unittest discover -s tests -v
      - name: 同源候选与离线验证
        run: python scripts/release.py build --output dist/ci-candidate
